<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOBERAI · SoberanoLab</title>
<style>
  :root {
    --fondo: #ecebe8; --tarjeta: #f7f6f3; --texto: #1d1d1b; --suave: #8a8984;
    --borde: #e2e0db; --campo: #ffffff; --negro: #111110; --verde: #2fbf71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--fondo); color: var(--texto);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .tarjeta {
    width: 100%; max-width: 380px; background: var(--tarjeta); border-radius: 22px;
    padding: 18px 18px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08);
    display: flex; flex-direction: column; gap: 14px;
  }
  .cabeza { display: flex; align-items: center; justify-content: space-between; }
  .titulo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 3px rgba(47,191,113,.18); }
  .punto.apagado { background: #c9c7c1; box-shadow: none; }
  .agentes { display: flex; gap: 4px; background: #ebe9e4; border-radius: 999px; padding: 3px; }
  .agentes button {
    border: 0; background: transparent; color: var(--suave); font: inherit; font-size: 13px;
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .agentes button[aria-pressed="true"] { background: var(--campo); color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .esfera {
    width: 132px; height: 132px; margin: 6px auto 0; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 32% 26%, #fafafa 0%, #9c9c9c 9%, #3a3a3a 32%, #111 62%, #000 100%);
    box-shadow: 0 18px 30px -12px rgba(0,0,0,.45);
    transition: transform .4s ease;
  }
  .esfera img { width: 70%; filter: invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.6)); opacity: .92; }
  .esfera.pensando { animation: latido 1.4s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.04); } }
  .ayuda { text-align: center; color: var(--suave); font-size: 14px; }
  .charla { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; padding-right: 2px; }
  .msj { font-size: 15.5px; }
  .msj.usuario { align-self: flex-end; background: #e7e5e0; border-radius: 16px 16px 4px 16px; padding: 8px 12px; max-width: 85%; }
  .msj.agente { align-self: flex-start; max-width: 95%; }
  .msj.error { color: #a33; }
  form {
    display: flex; align-items: center; gap: 6px; background: var(--campo); border: 1px solid var(--borde);
    border-radius: 999px; padding: 6px 6px 6px 16px;
  }
  form input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15.5px; color: var(--texto); min-width: 0; }
  form input::placeholder { color: #aaa9a4; }
  .icono { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--suave); }
  .icono:disabled { cursor: not-allowed; opacity: .5; }
  .enviar { background: var(--negro); color: #fff; }
  .enviar:disabled { opacity: .35; }
  button:focus-visible { outline: 2px solid var(--negro); outline-offset: 2px; }
  form input:focus-visible { outline: none; }
  form:focus-within { border-color: #b9b7b1; box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
  .pie { text-align: center; font-size: 12px; color: var(--suave); }
  @media (prefers-reduced-motion: reduce) { .esfera.pensando { animation: none; } }
</style>
</head>
<body>
<main class="tarjeta" aria-label="Asistente SOBERAI">
  <div class="cabeza">
    <div class="titulo"><span class="punto" id="punto"></span><span id="nombre">SOBERAI</span></div>
    <div class="agentes" role="group" aria-label="Elegí el asistente">
      <button type="button" data-agente="soberanolab" aria-pressed="true">SoberanoLab</button>
      <button type="button" data-agente="portfolio" aria-pressed="false">Pedro</button>
    </div>
  </div>

  <div class="esfera" id="esfera"><img src="/web/logo.png" alt="SoberanoLab"></div>
  <p class="ayuda" id="ayuda">Preguntá lo que quieras</p>

  <div class="charla" id="charla" aria-live="polite"></div>

  <form id="form">
    <input id="entrada" maxlength="500" autocomplete="off" placeholder="Escribí tu pregunta…" aria-label="Tu pregunta">
    <button type="button" class="icono" disabled title="Voz local con Whisper.cpp: próximamente" aria-label="Micrófono (próximamente)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit" class="icono enviar" id="enviar" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="pie">Corre en infraestructura propia de SoberanoLab · sin servicios de terceros</p>
</main>

<script>
const SALUDOS = {
  soberanolab: "Hola, soy el asistente de SoberanoLab. Preguntame qué es SOBERAI o qué proyectos hicimos.",
  portfolio: "Hola, soy el agente de Pedro. Preguntame por su experiencia, sus proyectos o su stack.",
};
const charla = document.getElementById("charla"), form = document.getElementById("form");
const entrada = document.getElementById("entrada"), enviar = document.getElementById("enviar");
const esfera = document.getElementById("esfera"), punto = document.getElementById("punto");
let agente = "soberanolab";

function nuevaSesion() { return "web-" + Math.random().toString(36).slice(2, 12); }
let sesion = nuevaSesion();

function agregar(clase, texto) {
  const p = document.createElement("p");
  p.className = "msj " + clase; p.textContent = texto;
  charla.appendChild(p); charla.scrollTop = charla.scrollHeight;
  return p;
}
function elegir(nombre) {
  agente = nombre; sesion = nuevaSesion(); charla.innerHTML = "";
  document.querySelectorAll(".agentes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.agente === nombre));
  agregar("agente", SALUDOS[nombre]);
}
document.querySelectorAll(".agentes button").forEach(b => b.addEventListener("click", () => elegir(b.dataset.agente)));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const mensaje = entrada.value.trim();
  if (!mensaje) return;
  agregar("usuario", mensaje); entrada.value = "";
  enviar.disabled = true; esfera.classList.add("pensando");
  const salida = agregar("agente", "…");
  try {
    const r = await fetch(`/publico/chat/${agente}/stream`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sesion, mensaje }),
    });
    if (r.status === 429) throw new Error("Hiciste muchas preguntas seguidas. Esperá un minuto.");
    if (!r.ok) throw new Error("No pude responder ahora. Probá de nuevo en un rato.");
    const lector = r.body.getReader(), dec = new TextDecoder();
    let buffer = "", texto = "";
    while (true) {
      const { value, done } = await lector.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      const partes = buffer.split("\n\n"); buffer = partes.pop();
      for (const parte of partes) {
        const dato = parte.replace(/^data: /, "");
        if (dato === "[FIN]") continue;
        texto += JSON.parse(dato).texto; salida.textContent = texto;
        charla.scrollTop = charla.scrollHeight;
      }
    }
  } catch (err) {
    salida.className = "msj agente error"; salida.textContent = err.message;
  } finally {
    enviar.disabled = false; esfera.classList.remove("pensando"); entrada.focus();
  }
});

fetch("/salud").then(r => r.ok || punto.classList.add("apagado")).catch(() => punto.classList.add("apagado"));
elegir("soberanolab");
</script>
</body>
</html>
