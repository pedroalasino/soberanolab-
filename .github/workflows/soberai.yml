name: SOBERAI tests

on:
  push:
    paths: ["soberai/**", ".github/workflows/soberai.yml"]
  pull_request:
    paths: ["soberai/**", ".github/workflows/soberai.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soberai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
